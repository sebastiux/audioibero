name: Wumpus Metallica · GitHub Pages

# Pruebas + build en cada push/PR que toque el juego; despliegue automático a GitHub Pages
# cuando el push llega a la rama por defecto (o al lanzarlo a mano con "Run workflow").
on:
  push:
    paths:
      - "wumpus-metallica/**"
      - ".github/workflows/wumpus-pages.yml"
  pull_request:
    paths:
      - "wumpus-metallica/**"
      - ".github/workflows/wumpus-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wumpus-metallica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wumpus-metallica/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wumpus-metallica/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
